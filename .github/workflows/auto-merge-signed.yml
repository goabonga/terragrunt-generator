name: auto-merge-signed

# A write-access maintainer authorizes merging with the auto-merge label.
# Only trusted Python and Git plumbing run with the signing key. PR code
# runs in the ordinary CI, required before and after re-authoring/signing.
# pull_request_target is required to sign and push with secrets; only trusted
# code from main runs here, PR code is never executed.
on:  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    branches: [main, "issue-*"]
    types: [labeled]

permissions:
  contents: read
  # Comments and label removal use the workflow token, never the merge PAT.
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: auto-merge-signed-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  MERGE_LABEL: auto-merge

jobs:
  merge:
    name: merge into ${{ github.event.pull_request.base.ref }}
    if: github.event.label.name == 'auto-merge' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    # Waiting for earlier pull requests and their releases can take hours.
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.AUTO_MERGE_PAT }}
      # Comments and labels appear under the maintainer account.
      PR_WRITE_TOKEN: ${{ secrets.AUTO_MERGE_PAT }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      LABELLER: ${{ github.event.sender.login }}
    steps:
      - name: Checkout trusted code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Validate merge authorization and signing availability
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: python3 trusted/scripts/ci_automation.py validate-merge
      - name: Checkout main with its release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: queue
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: "3.12"
      - name: Install multicz
        run: uv tool install multicz
      - name: Wait for earlier pull requests and pending releases
        env:
          QUEUE_DIR: queue
        run: python3 trusted/scripts/ci_automation.py queue
      - name: Wait for original commit checks
        env:
          CHECKS_TOKEN: ${{ github.token }}
        run: python3 trusted/scripts/ci_automation.py wait
      - name: Checkout validated PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Configure the maintainer signing identity
        working-directory: pr
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          PUSH_TOKEN: ${{ secrets.AUTO_MERGE_PAT }}
          GIT_USER_NAME: ${{ vars.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ vars.GIT_USER_EMAIL }}
          GIT_SIGNING_KEY: ${{ vars.GIT_SIGNING_KEY }}
        run: python3 "$GITHUB_WORKSPACE/trusted/scripts/ci_automation.py" configure-signing
      - name: Rebase and sign every commit
        working-directory: pr
        run: python3 "$GITHUB_WORKSPACE/trusted/scripts/ci_automation.py" rebase --mode merge
      - name: Push signed commits with an explicit lease
        working-directory: pr
        run: python3 "$GITHUB_WORKSPACE/trusted/scripts/ci_automation.py" push --mode merge
      - name: Wait for signed commit checks
        working-directory: pr
        env:
          CHECKS_TOKEN: ${{ github.token }}
        run: python3 "$GITHUB_WORKSPACE/trusted/scripts/ci_automation.py" wait --signed
      - name: Fast-forward the base branch after checks
        working-directory: pr
        run: python3 "$GITHUB_WORKSPACE/trusted/scripts/ci_automation.py" merge
      - name: Remove signing credentials
        if: always()
        run: |
          if [ -f trusted/scripts/ci_automation.py ]; then
            python3 trusted/scripts/ci_automation.py cleanup
          fi
      - name: Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          GIT_USER_NAME: ${{ vars.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ vars.GIT_USER_EMAIL }}
        run: python3 trusted/scripts/ci_automation.py summary --title "Signed automatic merge"
