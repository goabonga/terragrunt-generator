name: ci

on:
  pull_request:
    # An issue branch collects the pull requests of its sub-issues before it
    # reaches main, so they are checked like the ones into main.
    branches: [main, "issue-*"]
  push:
    branches: [main]

# The quality jobs skip the `chore(release)` commit multicz pushes to main:
# the run that cut the release already validated the code it carries, and
# `release` and its publish jobs need them, so they are skipped with them.

# `concurrency` cancels superseded PR runs but never main-branch releases.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    # An explicit shell enables pipefail, so `| tee` keeps the tool's status.
    shell: bash

jobs:
  # Lint with ruff: `ruff check` (E, F, I, B, UP, SIM) plus a separate
  # `ruff format --check` so whitespace/quote-style violations are caught
  # for contributors who skipped the pre-commit hooks.
  lint:
    name: lint
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Sync
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check --output-format=json --output-file=ruff.json src tests
      - name: Summarize ruff check
        if: ${{ !cancelled() }}
        run: python3 scripts/format_summary.py ruff-check ruff.json
      - name: Format check
        if: ${{ !cancelled() }}
        run: uv run ruff format --check src tests 2>&1 | tee ruff-format.txt
      - name: Summarize ruff format
        if: ${{ !cancelled() }}
        run: python3 scripts/format_summary.py ruff-format ruff-format.txt

  # Strict static type checking with mypy on the public src/.
  type-check:
    name: type-check
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Sync
        run: uv sync --frozen
      - name: Type-check
        run: uv run mypy src 2>&1 | tee mypy.txt
      - name: Summarize mypy
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/format_summary.py text mypy mypy.txt

  # Second static type check, with pyright, on the public src/. mypy and
  # pyright disagree on inference and narrowing, so each catches what the
  # other lets through.
  pyright:
    name: pyright
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Sync
        run: uv sync --frozen
      - name: Type-check
        run: uv run --no-sync pyright --outputjson > pyright.json
      - name: Summarize pyright
        if: ${{ !cancelled() }}
        run: python3 scripts/format_summary.py pyright pyright.json

  # Verify the two-line SPDX header on every Python source and config.
  license-headers:
    name: license-headers
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check SPDX headers
        run: |
          {
            python3 scripts/add_license_header.py --path src --types py --check
            python3 scripts/add_license_header.py --path tests --types py --check
            python3 scripts/add_license_header.py --path scripts --types py --check
            python3 scripts/add_license_header.py --path .github --types yml --check
            python3 scripts/add_license_header.py --path . --types toml --check
          } 2>&1 | tee headers.txt
      - name: Summarize license headers
        if: ${{ !cancelled() }}
        run: python3 scripts/format_summary.py headers headers.txt

  # Run the test suite with coverage and report to Codecov.
  test:
    name: test
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Sync
        run: uv sync --frozen
      - name: Run tests with coverage
        run: |
          uv run pytest \
            --cov=terragrunt_generator \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=junit.xml \
            -o junit_family=legacy
      - name: Summarize tests and coverage
        if: ${{ !cancelled() }}
        run: python3 scripts/format_summary.py pytest --junit junit.xml --coverage coverage.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          disable_search: true
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: junit.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          disable_search: true

  # Static security analysis of the source (Bandit).
  bandit:
    name: bandit
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Run Bandit
        run: uvx bandit --recursive src --format json --output bandit.json
      - name: Summarize bandit
        if: ${{ !cancelled() }}
        run: python3 scripts/format_summary.py bandit bandit.json

  # Audit the locked dependency graph against the PyPI advisory DB.
  pip-audit:
    name: pip-audit
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Export locked requirements
        # `pip-audit --path .venv` finds no package in a uv venv and
        # audits nothing, so audit the pinned lock export instead.
        run: uv export --frozen --all-groups --no-emit-project --no-hashes --output-file requirements.txt
      - name: Run pip-audit
        run: uvx pip-audit -r requirements.txt --no-deps --disable-pip --format json --output audit.json
      - name: Summarize pip-audit
        if: ${{ !cancelled() }}
        run: python3 scripts/format_summary.py pip-audit audit.json

  # Multi-source vulnerability scan via OSV-Scanner (reads uv.lock).
  osv-scanner:
    name: osv-scanner
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install OSV-Scanner
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL \
            "https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64" \
            -o "$HOME/.local/bin/osv-scanner"
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run OSV-Scanner
        run: osv-scanner scan source --lockfile=uv.lock 2>&1 | tee osv-scanner.txt
      - name: Summarize osv-scanner
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/format_summary.py text osv-scanner osv-scanner.txt

  # Release on main only: bump the version, write the changelog, create
  # the release commit + tag and push them back. Gated on every quality
  # job; `needs` blocks on any upstream failure.
  release:
    name: release
    needs:
      - lint
      - type-check
      - pyright
      - license-headers
      - test
      - bandit
      - pip-audit
      - osv-scanner
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      no_bumps: ${{ steps.bump.outputs.no_bumps }}
      version: ${{ steps.bump.outputs.version }}
      # True only when the *package* moved. A `docs:` commit bumps the
      # `docs` component alone, which has no wheel and no PyPI project,
      # so `no_bumps == 'false'` is not enough to gate `pypi-publish`.
      package_bumped: ${{ steps.bump.outputs.package_bumped }}
      # True when the `docs` component moved, either directly by a `docs:`
      # commit or by the cascade of a package bump. Gates the site deploy.
      docs_bumped: ${{ steps.bump.outputs.docs_bumped }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The main-protection ruleset only lets the maintainer push the
          # release commit and its tag; the workflow token cannot bypass it.
          token: ${{ secrets.AUTO_MERGE_PAT || github.token }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install multicz
        run: uv tool install multicz
      - name: Configure git author
        # Attribute the release commit to whoever pushed the head commit
        # that triggered CI, falling back to the github-actions[bot]
        # noreply identity when the payload carries no author.
        env:
          NAME: ${{ github.event.head_commit.author.name }}
          EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          git config user.name  "${NAME:-github-actions[bot]}"
          git config user.email "${EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
      - name: Detect GPG availability
        # Secrets can't be referenced from `if:` directly, so promote
        # their presence to a step output.
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Import and unlock GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Pre-cache the passphrase in gpg-agent via a dummy sign so
          # subsequent `git commit -S` / `git tag -s` don't prompt.
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          # Derive the signing key id from the imported key; no extra
          # secret needed.
          KEY_ID=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"
      - name: Plan release
        run: uv tool run multicz plan --summary "$GITHUB_STEP_SUMMARY"
      - name: Bump, commit, tag, push (signed)
        id: bump_signed
        if: steps.gpg.outputs.available == 'true'
        run: |
          set -euo pipefail
          PLAN=$(uv tool run multicz bump --commit --tag --push --sign --output json)
          BUMPED=$(echo "$PLAN" | jq -r '.bumps | keys | join(" ")')
          PACKAGE_BUMPED=$(echo "$PLAN" | jq -r '.bumps // {} | has("terragrunt-generator")')
          DOCS_BUMPED=$(echo "$PLAN" | jq -r '.bumps // {} | has("docs")')
          echo "package_bumped=$PACKAGE_BUMPED" >> "$GITHUB_OUTPUT"
          echo "docs_bumped=$DOCS_BUMPED" >> "$GITHUB_OUTPUT"
          if [ -z "$BUMPED" ]; then
            echo "no_bumps=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_bumps=false" >> "$GITHUB_OUTPUT"
            echo "version=$(uv tool run multicz get terragrunt-generator)" >> "$GITHUB_OUTPUT"
          fi
      - name: Bump, commit, tag, push
        id: bump_unsigned
        if: steps.gpg.outputs.available != 'true'
        run: |
          set -euo pipefail
          PLAN=$(uv tool run multicz bump --commit --tag --push --output json)
          BUMPED=$(echo "$PLAN" | jq -r '.bumps | keys | join(" ")')
          PACKAGE_BUMPED=$(echo "$PLAN" | jq -r '.bumps // {} | has("terragrunt-generator")')
          DOCS_BUMPED=$(echo "$PLAN" | jq -r '.bumps // {} | has("docs")')
          echo "package_bumped=$PACKAGE_BUMPED" >> "$GITHUB_OUTPUT"
          echo "docs_bumped=$DOCS_BUMPED" >> "$GITHUB_OUTPUT"
          if [ -z "$BUMPED" ]; then
            echo "no_bumps=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_bumps=false" >> "$GITHUB_OUTPUT"
            echo "version=$(uv tool run multicz get terragrunt-generator)" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve release outputs
        id: bump
        run: |
          if [ "${{ steps.gpg.outputs.available }}" = "true" ]; then
            echo 'no_bumps=${{ steps.bump_signed.outputs.no_bumps }}' >> "$GITHUB_OUTPUT"
            echo 'version=${{ steps.bump_signed.outputs.version }}' >> "$GITHUB_OUTPUT"
            echo 'package_bumped=${{ steps.bump_signed.outputs.package_bumped }}' >> "$GITHUB_OUTPUT"
            echo 'docs_bumped=${{ steps.bump_signed.outputs.docs_bumped }}' >> "$GITHUB_OUTPUT"
          else
            echo 'no_bumps=${{ steps.bump_unsigned.outputs.no_bumps }}' >> "$GITHUB_OUTPUT"
            echo 'version=${{ steps.bump_unsigned.outputs.version }}' >> "$GITHUB_OUTPUT"
            echo 'package_bumped=${{ steps.bump_unsigned.outputs.package_bumped }}' >> "$GITHUB_OUTPUT"
            echo 'docs_bumped=${{ steps.bump_unsigned.outputs.docs_bumped }}' >> "$GITHUB_OUTPUT"
          fi

  # Build and publish to PyPI, then create the GitHub Release. Trusted
  # Publishing (OIDC) via the `pypi` environment, with a token fallback.
  pypi-publish:
    name: pypi-publish
    needs: [release]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.release.result == 'success'
      && needs.release.outputs.package_bumped == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/terragrunt-generator/
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - uses: astral-sh/setup-uv@v7
        with:
          # No cache in the job that publishes: a poisoned cache entry
          # would end up in the wheel.
          enable-cache: false
      - name: Install multicz
        run: uv tool install multicz
      - name: Build wheel and sdist
        run: |
          set -euo pipefail
          uv build --out-dir dist
          ls -l dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          skip-existing: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.release.outputs.version }}"
          # multicz tags with tag_format = "{version}" (bare, e.g. 1.0.0).
          # Use the same tag here: a "v${version}" tag does not exist when
          # release-notes runs (it returns empty notes) and `gh release
          # create` would then create a duplicate "v1.0.0" tag.
          tag="${version}"
          notes=$(uv tool run multicz release-notes --tag "$tag")
          gh release create "$tag" --title "$tag" --notes "$notes" dist/*
      - name: Summarize publish
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: >-
          python3 scripts/format_summary.py publish dist
          --package terragrunt-generator
          --version "${{ needs.release.outputs.version }}"

  # Build the Zensical site and deploy it to GitHub Pages, only when the
  # `docs` multicz component moved. That covers both directions:
  #
  #   - a package bump cascades a `docs` patch (the site embeds version
  #     numbers and changelog content, so a release invalidates the
  #     rendered output even when no markdown was touched);
  #   - a `docs:` push bumps the `docs` component directly, so the site
  #     redeploys without the package moving.
  #
  # Any other push to main - a `ci:`, `test:` or dependency commit, which
  # multicz plans no bump for - leaves the site as it is. It used to be
  # gated on the release job succeeding alone, which redeployed the
  # unchanged site on every push.
  #
  # Gated on `docs_bumped`, set from the bump plan exactly like
  # `package_bumped` for `pypi-publish`, and not on `no_bumps`, whose
  # term silently skipped this job in the sibling repository.
  #
  # Runs in parallel with `pypi-publish` - the site documents the source
  # at the tagged commit, not the PyPI artifact, so it does not need
  # PyPI to be live first. On a docs-only release `pypi-publish` does
  # not run at all.
  docs:
    name: docs
    needs: [release]
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.release.result == 'success'
      && needs.release.outputs.docs_bumped == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Record the release outputs this job was gated on
        # Cheap forensics: a skipped deploy otherwise leaves no trace of
        # what the downstream gate actually read.
        run: |
          {
            echo "## Docs deploy - release outputs as seen downstream"
            echo ""
            echo "| Output | Value |"
            echo "| --- | --- |"
            echo "| \`no_bumps\` | \`${{ needs.release.outputs.no_bumps }}\` |"
            echo "| \`package_bumped\` | \`${{ needs.release.outputs.package_bumped }}\` |"
            echo "| \`docs_bumped\` | \`${{ needs.release.outputs.docs_bumped }}\` |"
            echo "| \`version\` | \`${{ needs.release.outputs.version }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        with:
          # Pull the release commit multicz just pushed so the site is
          # built from the tagged tree, not the pre-release one.
          ref: main
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install Zensical (doc group)
        run: uv sync --frozen --only-group doc
      - name: Build site
        run: uv run --no-sync zensical build --clean 2>&1 | tee zensical.txt
      - name: Summarize site build
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/format_summary.py text zensical zensical.txt
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
