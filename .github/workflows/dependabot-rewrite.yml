name: dependabot-rewrite

# `pull_request_target` is required so the workflow has access to
# `GPG_PRIVATE_KEY` / `GPG_PASSPHRASE` (regular `pull_request` runs
# without secrets on bot-triggered events). The workflow body is loaded
# from `main`, not from the PR branch, so we are not executing
# untrusted PR-modified workflow code.
#
# The gate on the pull request author id (49699333 is dependabot[bot])
# ensures the rewrite only fires for genuine Dependabot PRs; the actor
# would change when someone else re-runs the workflow. The rewrite script
# comes from the trusted checkout of main, never from the pull request
# branch it rewrites, so the signing key never meets pull request code.
# The lock is regenerated by uv before the signing key is imported.

on:  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write       # force-push the rewritten branch
  pull-requests: write  # update the PR

jobs:
  rewrite:
    name: rewrite dependabot commits
    if: github.event.pull_request.user.id == 49699333
    runs-on: ubuntu-24.04
    concurrency:
      group: dependabot-rewrite-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Decide whether the branch needs rewriting
        # The rewrite re-authors the commits and the push, made with the
        # merge token, starts this workflow again. Only a head commit
        # still authored by Dependabot needs the rewrite: once it is
        # re-authored the run stops, which ends the loop.
        #
        # Secrets can't be used inside `if:` directly, so their presence
        # is promoted to a step output and the rest is gated on it.
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          AUTHOR=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA" --jq '.author.login')
          if [ "$AUTHOR" != "dependabot[bot]" ]; then
            {
              echo "## Dependabot rewrite: skipped"
              echo ""
              echo "The head commit is no longer authored by Dependabot: already rewritten."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_PASSPHRASE" ]; then
            {
              echo "## Dependabot rewrite: skipped"
              echo ""
              echo "GPG_PRIVATE_KEY and/or GPG_PASSPHRASE are not configured. "
              echo "The Dependabot PR ships with bot-authored, web-signed commits."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::GPG secrets unset; leaving Dependabot commits as-is"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout trusted code
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Checkout PR head branch
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # A push made with the workflow token starts no workflow, so the
          # rewritten head would never run CI nor be queued for merging.
          token: ${{ secrets.AUTO_MERGE_PAT || github.token }}
          persist-credentials: true

      - name: Install uv
        if: steps.gate.outputs.skip != 'true'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Split a grouped lock update per dependency
        # Runs before the signing key is imported. A group that only
        # touches uv.lock is regenerated one dependency at a time, so each
        # gets its own type; anything else stays a single commit.
        id: split
        if: steps.gate.outputs.skip != 'true'
        working-directory: pr
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          BASE_SHA=$(git merge-base "origin/$BASE_REF" HEAD)
          COUNT=$(python3 "$GITHUB_WORKSPACE/trusted/scripts/split_dependabot_lock.py" \
            prepare "$BASE_SHA" "$RUNNER_TEMP/split")
          if [ "$COUNT" -gt 1 ]; then
            echo "split=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GPG and git identity from the imported key
        if: steps.gate.outputs.skip != 'true'
        working-directory: pr
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Pre-cache the passphrase so subsequent --amend signs without
          # an interactive prompt.
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^sec/{print $5; exit}')
          # Pull the maintainer's name + email from the key UID so the
          # rewritten commits look identical to a manual local commit.
          UID_LINE=$(gpg --list-keys --with-colons "$KEY_ID" \
            | awk -F: '/^uid/{print $10; exit}')
          NAME="${UID_LINE%% <*}"
          EMAIL=$(printf '%s' "$UID_LINE" | sed -nE 's/.*<([^>]+)>.*/\1/p')
          git config user.name  "$NAME"
          git config user.email "$EMAIL"
          git config user.signingkey "$KEY_ID"
          git config commit.gpgsign true

      - name: Rewrite commits as Conventional Commits
        if: steps.gate.outputs.skip != 'true' && steps.split.outputs.split != 'true'
        working-directory: pr
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          BASE_SHA=$(git merge-base "origin/$BASE_REF" HEAD)
          # Rebase replays each commit; the --exec script runs against
          # the new HEAD after every pick, reclassifying scope by file
          # changes and amending with --reset-author and a GPG signature.
          git rebase "$BASE_SHA" \
            --exec "python3 $GITHUB_WORKSPACE/trusted/scripts/rewrite_dependabot_commit.py"

      - name: Commit one dependency per commit
        if: steps.gate.outputs.skip != 'true' && steps.split.outputs.split == 'true'
        working-directory: pr
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/trusted/scripts/split_dependabot_lock.py" \
            commit "$RUNNER_TEMP/split"

      - name: Force-push rewritten branch
        if: steps.gate.outputs.skip != 'true'
        working-directory: pr
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git push --force-with-lease origin "HEAD:$HEAD_REF"

      - name: Retitle the pull request after its commits
        # The title Dependabot chose carries its own type, which the
        # rewrite may have changed (a runtime bump becomes fix(deps)).
        # The title goes through the REST API: `gh pr edit` needs a
        # token scope the workflow token does not have.
        if: steps.gate.outputs.skip != 'true'
        working-directory: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          TITLE=$(python3 "$GITHUB_WORKSPACE/trusted/scripts/rewrite_dependabot_commit.py" \
            title "origin/$BASE_REF..HEAD")
          if [ "$TITLE" != "$PR_TITLE" ]; then
            gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --method PATCH --field title="$TITLE"
          fi

      - name: Write step summary
        if: steps.gate.outputs.skip != 'true' && success()
        working-directory: pr
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          {
            echo "## Dependabot rewrite: applied"
            echo ""
            echo "PR branch \`$HEAD_REF\` rewritten:"
            echo ""
            echo "- Conventional Commit type inferred: \`ci\`, \`fix(deps)\` (runtime) or \`chore(deps)\` (dev)"
            echo "- A group that only touches uv.lock is split into one commit per dependency"
            echo "- Authored and GPG-signed as \`$(git config user.name) <$(git config user.email)>\`"
          } >> "$GITHUB_STEP_SUMMARY"
