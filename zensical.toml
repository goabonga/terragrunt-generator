[project]
site_name = "terragrunt-generator"
site_description = "Generate documented terragrunt.hcl manifests from Terraform module variables."
site_author = "Chris"
site_url = "https://goabonga.github.io/terragrunt-generator/"
repo_url = "https://github.com/goabonga/terragrunt-generator"
repo_name = "goabonga/terragrunt-generator"

# Navigation tree for the published site. Ordered as a reader would
# progress: what the tool is, how to install and run it, then the
# stability contract that governs future changes.
nav = [
    { "Introduction" = "index.md" },
    { "Installation" = "installation.md" },
    { "Usage" = "usage.md" },
    { "Examples" = [
        { "Bootstrap a GCP infra" = "bootstrap-gcp.md" },
    ] },
    { "Stability & deprecation" = "stability.md" },
]

# Footer. `copyright` renders in the highlighted slot of
# `partials/copyright.html`, above the theme's own attribution line;
# `extra.generator = false` is the switch that partial reads to drop
# that line, leaving this as the only footer text. Raw HTML, not
# Markdown - the value is interpolated into the template as-is.
copyright = """
Made with <span style="color: #e25555;">&#10084;</span> by
<a href="https://github.com/goabonga" target="_blank" rel="noopener">goabonga</a>
"""

[project.extra]
generator = false

# Owned by multicz: the `docs` component lists this key in its
# `bump_files`, so a docs release writes the site version here. It is
# the component's only version file - the package version lives in
# pyproject.toml and the site does not render either number anywhere.
[project.extra.versions]
docs = "0.0.0"

# Branding. Both files are generated from
# `assets/terragrunt-generator.svg` by `scripts/regen-icons.sh` and
# committed: the docs job builds the site from the checked-in tree and
# never installs the `favicon` dep group. Paths resolve relative to the
# docs dir.
[project.theme]
logo = "terragrunt-generator.svg"
favicon = "favicon.ico"

# Dark first. Neither entry declares `media`, so the OS
# `prefers-color-scheme` is ignored and every visitor lands on the first
# one - slate - whatever their system is set to. The toggle in the
# header switches to the next entry and the theme persists that choice
# in localStorage, so the pin only decides the *first* visit.
#
# Deep purple matches the logo; without an explicit `primary`/`accent`
# the palette partial falls back to indigo, which clashes with it.
[[project.theme.palette]]
scheme = "slate"
primary = "deep purple"
accent = "deep purple"
toggle = { icon = "material/brightness-4", name = "Switch to light mode" }

[[project.theme.palette]]
scheme = "default"
primary = "deep purple"
accent = "deep purple"
toggle = { icon = "material/brightness-7", name = "Switch to dark mode" }
